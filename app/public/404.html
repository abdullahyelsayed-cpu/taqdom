<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,follow"/>
  <meta name="theme-color" content="#050817"/>
  <title>Page not found | Taqdom</title>
  <style>
    :root{color-scheme:dark;background:#050817;color:#f5f7ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 55% 0%,#3c287c66,transparent 55%),#050817}
    main{width:min(620px,100%);padding:clamp(28px,7vw,60px);border:1px solid #53548880;border-radius:26px;background:#0b1024e8;box-shadow:0 30px 90px #0006}
    .brand{display:flex;align-items:center;gap:12px;color:#f5f7ff;text-decoration:none;font-weight:800;letter-spacing:.12em}
    .brand img{width:44px;height:44px}.eyebrow{margin:34px 0 12px;color:#a897ff;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(2.3rem,8vw,4.2rem);letter-spacing:-.06em;line-height:1.05}p{color:#b7c2e1;line-height:1.8}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.actions a{padding:12px 16px;border-radius:999px;color:#fff;text-decoration:none;border:1px solid #7774cf;background:#18183c}.actions a:first-child{border-color:#a48bff;background:linear-gradient(110deg,#a453ff,#566dff,#29bfff)}
    [dir=rtl] body{font-family:system-ui,Tahoma,Arial,sans-serif}
  </style>
</head>
<body><main>
  <a class="brand" href="/"><img src="/taqdom-mark.svg" alt=""/> TAQDOM</a>
  <p class="eyebrow">404 · PAGE NOT FOUND</p>
  <h1>This page isn’t here.</h1>
  <p>The address may be incorrect or the page may have moved. Return home or open the Arabic version of Taqdom.</p>
  <div class="actions"><a href="/">Go to homepage ↗</a><a href="/ar/" lang="ar" dir="rtl">الصفحة الرئيسية بالعربية ↗</a></div>
</main>
<script>
  if (location.pathname.startsWith('/ar')) {
    document.documentElement.lang = 'ar';
    document.documentElement.dir = 'rtl';
    document.title = 'الصفحة غير موجودة | تقدّم';
    document.querySelector('.eyebrow').textContent = '404 · الصفحة غير موجودة';
    document.querySelector('h1').textContent = 'هذه الصفحة غير متاحة.';
    document.querySelector('main > p:not(.eyebrow)').textContent = 'قد يكون العنوان غير صحيح أو ربما نُقلت الصفحة. يمكنك العودة إلى الصفحة الرئيسية أو فتح نسخة تقدّم باللغة الإنجليزية.';
    document.querySelector('.actions a:first-child').textContent = 'الصفحة الرئيسية ↗';
    document.querySelector('.actions a:first-child').href = '/ar/';
    document.querySelector('.actions a:last-child').textContent = 'English homepage ↗';
    document.querySelector('.actions a:last-child').href = '/';
    document.querySelector('.actions a:last-child').removeAttribute('dir');
  }
</script>
</body>
</html>
